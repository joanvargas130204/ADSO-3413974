ill="#f6efe6" stroke="#ddd"/><text x="470" y="134" font-size="16" font-weight="bold" fill="#4b2e1e">Resumen del pedido</text><text x="470" y="166" font-size="12" fill="#666">Producto</text><text x="680" y="166" font-size="12" fill="#666">Cant.</text><text x="770" y="166" font-size="12" fill="#666">Subtotal</text><line x1="470" x2="856" y1="178" y2="178" stroke="#ddd"/><text x="470" y="194" font-size="14">Tueste medio 500 g</text><text x="690" y="194" font-size="14">2</text><text x="770" y="194" font-size="14">$90.000</text><line x1="470" x2="856" y1="212" y2="212" stroke="#ddd"/><text x="470" y="228" font-size="14">Cápsulas origen especial</text><text x="690" y="228" font-size="14">1</text><text x="770" y="228" font-size="14">$38.000</text><line x1="470" x2="856" y1="256" y2="256" stroke="#999"/><text x="470" y="282" font-size="14">Subtotal</text><text x="770" y="282" font-size="14">$128.000</text><text x="470" y="310" font-size="14">Despacho (gratis sobre $150.000)</text><text x="770" y="310" font-size="14">$12.000</text><text x="470" y="344" font-size="16" font-weight="bold">Total</text><text x="770" y="344" font-size="16" font-weight="bold">$140.000</text><text x="470" y="382" font-size="12" fill="#666">Ganarás 140 puntos con esta compra.</text><text x="470" y="402" font-size="12" fill="#666">El pedido queda pendiente; no hay cobro en línea.</text><rect x="470" y="560" width="386" height="34" rx="6" fill="#c8801e"/><text x="663.0" y="582.0" font-size="14" fill="#fff" text-anchor="middle">Confirmar pedido</text></svg>